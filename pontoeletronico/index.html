<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Ponto — Marcação</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="stylesheet" href="ponto.css?v=20260927a" />
</head>
<body class="estacao">

<header class="topo">
  <div class="logo"><i class="ti ti-clock-check"></i> Ponto<span>Eletrônico</span></div>
  <div class="sub" id="topo-empresa"></div>
</header>

<div class="est-topo" id="bloco-relogio" hidden>
  <div class="est-empresa" id="est-empresa"></div>
  <div class="est-relogio" id="relogio">--:--:--</div>
  <div class="est-data" id="data"></div>
  <div class="cam-vivo" id="cam-vivo" hidden></div>
</div>

<main class="est-corpo" id="corpo"></main>

<!-- Modo totem (estação com reconhecimento facial): a câmera é a tela inicial -->
<div class="totem" id="totem" hidden>
  <div class="totem-cam" id="totem-cam"></div>
  <div class="totem-oval" id="totem-oval"></div>
  <div class="totem-topo">
    <div class="totem-hora" id="totem-hora">--:--</div>
    <div class="totem-data" id="totem-data"></div>
    <div class="totem-est" id="totem-est"></div>
  </div>
  <div class="totem-painel" id="totem-painel"></div>
  <button type="button" class="totem-pin" id="totem-pin"><i class="ti ti-dialpad"></i> Marcar com PIN</button>
</div>
<div id="cupom" class="cupom" aria-hidden="true" style="display:none"></div>

<script src="config.js?v=20260927a"></script>
<script src="api.js?v=20260927a"></script>
<script src="foto.js?v=20260927a"></script>
<script src="rosto.js?v=20260927a"></script>
<script>
(function () {
  const { rpc, msgErro, esc, hora, dataHora, TIPOS, hojeISO } = window.Ponto;
  const $ = (id) => document.getElementById(id);
  const corpo = $('corpo');
  const TOKEN_KEY = 'ponto_estacao_token';
  const CFG = window.PONTO_CONFIG || {};
  const LARGURA_MM = Number(CFG.larguraCupomMm) || 80;   // bobina: 80 ou 58 (Elgin i9 aceita as duas)

  // Tamanho da página de impressão = largura da bobina; a área útil é ~8 mm menor.
  (function ajustarPagina() {
    const st = document.createElement('style');
    st.textContent = '@page{size:' + LARGURA_MM + 'mm auto;margin:0}';
    document.head.appendChild(st);
    document.documentElement.style.setProperty('--cupom-w', (LARGURA_MM - 8) + 'mm');
  })();

  function montarCupom(c) {
    const d = new Date(c.marcado_em);
    const data = d.toLocaleDateString('pt-BR', { timeZone: window.Ponto.TZ });
    return '<div class="c b">COMPROVANTE DE REGISTRO DE PONTO</div><div class="c b">DO TRABALHADOR</div><hr>' +
      '<div class="b">' + esc(c.empresa) + '</div>' +
      (c.cnpj ? '<div>CNPJ ' + esc(c.cnpj) + '</div>' : '') +
      (c.endereco ? '<div>' + esc(c.endereco) + '</div>' : '') + '<hr>' +
      '<div>Trabalhador</div><div class="b">' + esc(c.funcionario) + '</div>' +
      '<div class="k"><span>Marcação</span><span class="b">' + esc(TIPOS[c.tipo]).toUpperCase() + '</span></div>' +
      '<div class="k"><span>Data</span><span>' + esc(data) + '</span></div>' +
      '<div class="k"><span>Hora</span><span class="b">' + esc(hora(c.marcado_em)) + '</span></div>' +
      '<div class="k"><span>NSR</span><span>' + esc(c.nsr) + '</span></div><hr>' +
      '<div>Hash</div><div class="h">' + esc(c.hash) + '</div><hr>' +
      '<div class="c">Guarde este comprovante.</div>';
  }
  function imprimirCupom(c) {
    $('cupom').innerHTML = montarCupom(c);
    try { window.print(); } catch (e) { /* sem impressora: o comprovante continua na tela */ }
  }

  let token = null, info = null, offset = 0;
  let empAtual = null;       // aba (empresa) aberta na lista de nomes
  let sel = null;            // funcionário escolhido {id, nome}
  let pin = '';              // só em memória, apagado ao sair da tela
  let estado = null;         // resposta de "estado" (proximos, ultimas)
  let ocioso = null, volta = null;

  const guardar = { get: () => { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } },
                    set: (v) => { try { v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} } };

  /* ---------- relógio (hora do servidor; o computador só exibe) ---------- */
  function agora() { return new Date(Date.now() + offset); }
  function tick() {
    const d = agora();
    $('relogio').textContent = d.toLocaleTimeString('pt-BR', { timeZone: window.Ponto.TZ });
    $('data').textContent = d.toLocaleDateString('pt-BR', { timeZone: window.Ponto.TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    if (totemAtivo) {
      $('totem-hora').textContent = d.toLocaleTimeString('pt-BR', { timeZone: window.Ponto.TZ, hour: '2-digit', minute: '2-digit' });
      $('totem-data').textContent = $('data').textContent;
    }
  }
  setInterval(() => { if (info) tick(); }, 1000);

  /* ---------- controle de ociosidade ---------- */
  function armarOciosidade() {
    clearTimeout(ocioso);
    ocioso = setTimeout(() => inicio(), 45000);
  }
  ['click', 'keydown', 'touchstart'].forEach((ev) => document.addEventListener(ev, () => { if (sel) armarOciosidade(); }));

  function limpar() { pin = ''; sel = null; estado = null; clearTimeout(ocioso); clearInterval(volta); }

  /* ---------- telas ---------- */
  function mensagem(texto, tipo) {
    return texto ? '<div class="msg ' + (tipo || 'erro') + '">' + esc(texto) + '</div>' : '';
  }

  function telaAtivar(erro) {
    $('bloco-relogio').hidden = true;
    corpo.innerHTML =
      '<div class="card" style="max-width:460px;margin:2rem auto">' +
      '<h2>Ativar este computador</h2>' +
      '<p class="muted" style="margin-bottom:12px">Cole o código de ativação gerado no painel do gestor (Estações). Ele é usado uma vez por computador.</p>' +
      mensagem(erro) +
      '<div class="field"><label for="tk">Código de ativação</label><input id="tk" autocomplete="off" spellcheck="false"></div>' +
      '<div style="margin-top:12px"><button class="btn pri" id="ativar">Ativar</button></div></div>';
    $('ativar').onclick = async () => {
      const t = $('tk').value.trim();
      if (!t) return;
      const r = await rpc('estacao', { token: t });
      if (!r.ok) return telaAtivar(msgErro(r.erro));
      guardar.set(t); token = t; carregar(r);
    };
  }

  async function carregar(resp) {
    const r = resp || await rpc('estacao', { token });
    if (!r.ok) {
      if (r.erro === 'estacao_invalida') { guardar.set(null); token = null; return telaAtivar(msgErro(r.erro)); }
      corpo.innerHTML = mensagem(msgErro(r.erro)) + '<div class="voltar"><button class="btn" id="tentar">Tentar de novo</button></div>';
      $('tentar').onclick = () => carregar();
      return;
    }
    // servidor antigo (sem "empresas"): uma empresa só
    if (!r.empresas) r.empresas = [Object.assign({}, r.empresa, { funcionarios: r.funcionarios })];
    info = r;
    offset = new Date(r.agora).getTime() - Date.now();
    if (!r.empresas.some((e) => e.id === empAtual)) empAtual = r.empresas.length ? r.empresas[0].id : null;
    const nomes = r.empresas.map((e) => e.nome).join(' · ');
    $('est-empresa').textContent = (r.empresas.length === 1 ? nomes + ' · ' : '') + r.estacao.nome;
    $('topo-empresa').textContent = nomes;
    $('bloco-relogio').hidden = false;
    $('totem-est').textContent = nomes + ' · ' + r.estacao.nome;
    tick();
    inicio();
    // Estação com foto: câmera sempre ligada; a foto é o quadro do instante do toque em "Registrar"
    // (no totem, o quadro usado no reconhecimento).
    if (r.estacao.tira_foto && window.PontoFoto) window.PontoFoto.ligar(modoTotem() ? $('totem-cam') : $('cam-vivo')).then(sinal);
    else { if (window.PontoFoto) window.PontoFoto.desligar(); $('cam-vivo').hidden = true; sinal(); }
  }

  const modoTotem = () => !!(info && info.estacao.reconhece_rosto && info.estacao.tira_foto && window.PontoRosto && window.PontoFoto);
  // Tela inicial: câmera (totem) ou lista de nomes.
  function inicio(aviso) { return modoTotem() ? telaTotem(aviso) : irParaLista(aviso); }

  // Sinal de vida para o quadro de saúde do painel (último contato e diferença do relógio).
  async function sinal() {
    if (!token) return;
    const args = { token, relogio: new Date().toISOString() };
    // câmera: só informa depois de tentar usar (null = ainda não sabe)
    if (info && info.estacao.tira_foto && window.PontoFoto && window.PontoFoto.cameraOk !== null) args.camera = window.PontoFoto.cameraOk;
    const r = await rpc('estacao_sinal', args);
    if (r.ok && r.agora) offset = new Date(r.agora).getTime() - Date.now();
  }
  setInterval(sinal, 5 * 60 * 1000);

  const imprime = () => !!(info && info.estacao.imprime !== false) && CFG.imprimirAoMarcar !== false;

  function irParaLista(aviso) {
    limpar();
    if (!info) return;
    sairDoTotem();
    const emp = info.empresas.find((e) => e.id === empAtual) || { funcionarios: [] };
    const lista = emp.funcionarios;
    const abas = info.empresas.length > 1
      ? '<div class="emp-tabs" role="tablist">' + info.empresas.map((e) =>
          '<button class="emp-tab' + (e.id === empAtual ? ' ativa' : '') + '" role="tab" data-emp="' + e.id + '">' + esc(e.nome) + '</button>').join('') + '</div>'
      : '';
    corpo.innerHTML = mensagem(aviso && aviso.texto, aviso && aviso.tipo) + abas +
      '<h2 style="text-align:center;font-size:15px;color:var(--mut);margin-bottom:14px;font-weight:500">Quem é você?</h2>' +
      (lista.length
        ? '<div class="nomes">' + lista.map((f) => '<button class="nome-btn" data-id="' + f.id + '">' + esc(f.nome) + '</button>').join('') + '</div>'
        : '<p class="muted" style="text-align:center">Nenhum funcionário cadastrado nesta empresa.</p>') +
      (modoTotem() ? '<div class="voltar"><button class="btn" id="voltar-totem"><i class="ti ti-face-id"></i> Voltar para o reconhecimento</button></div>' : '');
    if ($('voltar-totem')) $('voltar-totem').onclick = () => telaTotem();
    corpo.querySelectorAll('.emp-tab').forEach((b) => b.onclick = () => { empAtual = Number(b.dataset.emp); irParaLista(); });
    corpo.querySelectorAll('.nome-btn').forEach((b) => b.onclick = () => {
      sel = lista.find((f) => f.id === Number(b.dataset.id)); pin = ''; telaPin();
    });
    // Não há botão de desvincular: só o gestor desativa a estação, pelo painel (Empresas e estações).
    // recarrega a lista de tempos em tempos (novos funcionários)
    clearTimeout(irParaLista.t);
    irParaLista.t = setTimeout(() => { if (!sel) carregar(); }, 5 * 60 * 1000);
  }

  /* ---------- modo totem: reconhecimento facial (especificação 11.4A) ---------- */
  const CONTAGEM_SEG = Number(CFG.totemContagemSeg) || 3;    // contagem antes de gravar sozinho
  const INTERVALO_MS = Number(CFG.totemIntervaloMs) || 250;  // entre análises da câmera
  const FALHA_MS = Number(CFG.totemFalhaMs) || 5000;        // rosto na frente sem reconhecer: avisa depois disso
  let totemAtivo = false, laco = null, recarga = null, contagem = null;
  let estadoT = 'espera', estavel = 0, falhasDesde = 0, pausaAte = 0;

  function painel(html) { $('totem-painel').innerHTML = html; }
  function aviso(texto, tipo) { painel('<div class="totem-msg ' + (tipo || '') + '">' + esc(texto) + '</div>'); }

  async function telaTotem(msg) {
    limpar();
    clearInterval(contagem);
    corpo.innerHTML = '';
    $('bloco-relogio').hidden = true;
    $('totem').hidden = false;
    totemAtivo = true;
    tick();
    window.PontoFoto.ligar($('totem-cam'));
    $('totem-pin').onclick = () => irParaLista();
    // de tempos em tempos relê a configuração da estação (ex.: reconhecimento desligado no painel)
    clearTimeout(recarga);
    recarga = setTimeout(() => { if (totemAtivo && estadoT === 'espera') carregar(); }, 10 * 60 * 1000);
    if (!window.PontoRosto.pronto()) {
      estadoT = 'carregando';
      aviso('Carregando o reconhecimento…');
      try { await window.PontoRosto.iniciar(); } catch (e) {
        estadoT = 'indisponivel';
        return aviso('Reconhecimento indisponível neste aparelho. Toque em "Marcar com PIN".', 'erro');
      }
      if (!totemAtivo) return;
    }
    espera(msg);
    agendar();
  }

  function sairDoTotem() {
    if (!totemAtivo) return;
    totemAtivo = false;
    clearTimeout(laco); clearTimeout(recarga); clearInterval(contagem);
    $('totem').hidden = true;
    $('bloco-relogio').hidden = false;
    if (info.estacao.tira_foto && window.PontoFoto) window.PontoFoto.ligar($('cam-vivo'));
  }

  function espera(msg) {
    estadoT = 'espera'; estavel = 0;
    $('totem-oval').className = 'totem-oval';
    if (msg && msg.texto) { aviso(msg.texto, msg.tipo); pausaAte = Date.now() + 2500; }
    else aviso('Aproxime o rosto');
  }
  function agendar() { clearTimeout(laco); if (totemAtivo) laco = setTimeout(passo, INTERVALO_MS); }

  async function passo() {
    if (!totemAtivo) return;
    if (estadoT === 'espera' && Date.now() >= pausaAte) {
      const v = window.PontoFoto.video();
      let a = null;
      try { a = v ? await window.PontoRosto.analisar(v) : null; } catch (e) { a = null; }
      if (totemAtivo && estadoT === 'espera') await avaliar(a);
    }
    agendar();
  }

  // Só reconhece com um rosto único, perto, de frente e parado por 2 análises seguidas.
  async function avaliar(a) {
    const oval = $('totem-oval');
    if (!a || !a.rostos) { estavel = 0; falhasDesde = 0; oval.className = 'totem-oval'; return aviso('Aproxime o rosto'); }
    if (a.rostos > 1) { estavel = 0; return aviso('Uma pessoa por vez'); }
    const r = a.rosto;
    if (r.largura < 0.18) { estavel = 0; return aviso('Chegue um pouco mais perto'); }
    if (Math.abs(r.yaw) > 0.35 || Math.abs(r.pitch) > 0.35) { estavel = 0; return aviso('Olhe de frente para a câmera'); }
    oval.className = 'totem-oval ok';
    if (++estavel < 2 || !r.descritor) return aviso('Fique parado…');
    await reconhecer(r);
  }

  async function reconhecer(r) {
    estadoT = 'reconhecendo';
    aviso('Reconhecendo…');
    const foto = await window.PontoFoto.capturarAgora();   // o quadro do reconhecimento é a foto de prova
    const resp = await rpc('reconhecer', { token, descritor: r.descritor, antispoof: r.antispoof, liveness: r.liveness });
    if (!totemAtivo) return;
    if (!resp.ok) {
      if (resp.erro === 'estacao_invalida' || resp.erro === 'rosto_desligado') return carregar();
      estadoT = 'espera'; estavel = 0; pausaAte = Date.now() + 2500;
      return aviso(msgErro(resp.erro), 'erro');
    }
    if (!resp.reconhecido) {
      estadoT = 'espera'; estavel = 0;
      if (!falhasDesde) falhasDesde = Date.now();
      if (Date.now() - falhasDesde >= FALHA_MS) {
        falhasDesde = 0; pausaAte = Date.now() + 3000;
        return aviso('Não reconhecemos. Tente de novo ou toque em "Marcar com PIN".', 'erro');
      }
      pausaAte = Date.now() + 400;
      return;
    }
    falhasDesde = 0;
    if (resp.recente) {
      rpc('cancelar_reconhecimento', { token, reconhecimento: resp.reconhecimento });
      estadoT = 'espera'; estavel = 0; pausaAte = Date.now() + 3000;
      return aviso('Você acabou de marcar, ' + resp.funcionario.nome + '.', 'ok');
    }
    confirmar(resp, foto);
  }

  // Contagem com o tipo sugerido; sem toque, grava sozinho. "Trocar" e "Não sou eu" param a contagem.
  function confirmar(resp, foto) {
    estadoT = 'confirmando';
    let seg = CONTAGEM_SEG;
    const f = resp.funcionario;
    const outros = resp.opcoes.filter((t) => t !== resp.sugestao);
    painel('<div class="totem-card"><div class="totem-nome">' + esc(f.nome) + '</div><div class="totem-emp">' + esc(f.empresa) + '</div>' +
      '<div class="totem-tipo">' + esc(TIPOS[resp.sugestao]).toUpperCase() + '</div>' +
      '<div class="totem-cont" id="t-cont"></div>' +
      '<div class="totem-acoes">' + (outros.length ? '<button class="btn" id="t-trocar"><i class="ti ti-switch-horizontal"></i> Trocar</button>' : '') +
      '<button class="btn bad" id="t-nao">Não sou eu</button></div></div>');
    const mostrar = () => { $('t-cont').textContent = 'Registrando em ' + seg + '…'; };
    mostrar();
    clearInterval(contagem);
    contagem = setInterval(() => {
      if (--seg <= 0) { clearInterval(contagem); gravar(resp, resp.sugestao, foto); } else mostrar();
    }, 1000);
    if ($('t-trocar')) $('t-trocar').onclick = () => {
      clearInterval(contagem);
      painel('<div class="totem-card"><div class="totem-nome">' + esc(f.nome) + '</div><div class="totem-emp">Qual marcação?</div>' +
        '<div class="totem-acoes" style="margin-top:12px">' + resp.opcoes.map((t) =>
          '<button class="btn pri" data-t-tipo="' + esc(t) + '">' + esc(TIPOS[t]) + '</button>').join('') +
        '<button class="btn" id="t-cancelar">Cancelar</button></div></div>');
      $('totem-painel').querySelectorAll('[data-t-tipo]').forEach((b) => b.onclick = () => gravar(resp, b.dataset.tTipo, foto));
      $('t-cancelar').onclick = () => { rpc('cancelar_reconhecimento', { token, reconhecimento: resp.reconhecimento }); espera(); };
      // sem escolha em 15 s, desiste (o reconhecimento vence em 60 s de qualquer forma)
      contagem = setTimeout(() => { if (estadoT === 'confirmando') { rpc('cancelar_reconhecimento', { token, reconhecimento: resp.reconhecimento }); espera(); } }, 15000);
    };
    $('t-nao').onclick = () => {
      clearInterval(contagem);
      rpc('cancelar_reconhecimento', { token, reconhecimento: resp.reconhecimento });
      espera({ texto: 'Tudo bem. Tente de novo ou toque em "Marcar com PIN".', tipo: '' });
    };
  }

  async function gravar(resp, tipo, foto) {
    clearInterval(contagem); clearTimeout(contagem);
    if (estadoT !== 'confirmando') return;
    estadoT = 'gravando';
    aviso('Registrando…');
    let fotoHash = null;
    if (foto) { try { fotoHash = await window.PontoFoto.hash(foto); } catch (e) { foto = null; } }
    const r = await rpc('registrar_rosto', { token, reconhecimento: resp.reconhecimento, tipo, foto_hash: fotoHash });
    if (!r.ok) {
      estadoT = 'espera'; estavel = 0; pausaAte = Date.now() + 3000;
      return aviso(msgErro(r.erro), 'erro');
    }
    if (foto && r.marcacao_id) window.PontoFoto.enviar(foto, { token, marcacaoId: r.marcacao_id });
    if (imprime()) setTimeout(() => imprimirCupom(r.comprovante), 150);
    const c = r.comprovante;
    estadoT = 'comprovante';
    painel('<div class="totem-card ok"><div class="totem-ok"><i class="ti ti-circle-check"></i></div>' +
      '<div class="totem-tipo">' + esc(TIPOS[c.tipo]) + ' registrada às ' + esc(hora(c.marcado_em)) + '</div>' +
      '<div class="totem-nome" style="font-size:20px">' + esc(c.funcionario) + '</div>' +
      '<div class="totem-emp">' + esc(c.empresa) + ' · NSR ' + esc(c.nsr) + '</div></div>');
    setTimeout(() => { if (totemAtivo && estadoT === 'comprovante') espera(); }, 4000);
  }

  function telaPin(erro) {
    armarOciosidade();
    corpo.innerHTML =
      '<div class="pinbox">' +
      '<div class="pin-nome">' + esc(sel.nome) + '</div>' +
      '<div class="muted">Digite seu PIN</div>' + mensagem(erro) +
      '<div class="pin-dots" id="dots"></div>' +
      '<div class="keypad">' +
      [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => '<button data-k="' + n + '">' + n + '</button>').join('') +
      '<button class="acao" data-k="cancelar">Cancelar</button><button data-k="0">0</button><button class="acao" data-k="apagar">Apagar</button>' +
      '</div>' +
      '<div style="margin-top:14px"><button class="btn pri" id="ok" style="width:100%;justify-content:center;padding:14px">Confirmar</button></div>' +
      '</div>';
    desenharPontos();
    corpo.querySelectorAll('.keypad button').forEach((b) => b.onclick = () => tecla(b.dataset.k));
    $('ok').onclick = confirmarPin;
  }
  function desenharPontos() { const d = $('dots'); if (d) d.innerHTML = '<i></i>'.repeat(pin.length); }
  function tecla(k) {
    if (k === 'cancelar') return inicio();
    if (k === 'apagar') pin = pin.slice(0, -1);
    else if (pin.length < 6) pin += k;
    desenharPontos();
  }
  document.addEventListener('keydown', (e) => {
    if (!sel || !$('dots')) return;
    if (/^[0-9]$/.test(e.key)) tecla(e.key);
    else if (e.key === 'Backspace') tecla('apagar');
    else if (e.key === 'Enter') confirmarPin();
    else if (e.key === 'Escape') inicio();
  });

  async function confirmarPin() {
    if (pin.length < 4) return;
    $('ok').disabled = true;
    const r = await rpc('estado', { token, funcionario_id: sel.id, pin });
    if (!r.ok) {
      pin = '';
      if (r.erro === 'estacao_invalida') return carregar();
      return telaPin(msgErro(r.erro));
    }
    estado = r; telaAcao();
  }

  function telaAcao(erro) {
    armarOciosidade();
    const botoes = estado.proximos.map((t, i) =>
      '<button class="acao-btn' + (i ? ' sec' : '') + '" data-tipo="' + esc(t) + '">' +
      (i ? esc(TIPOS[t]) : 'Registrar ' + esc(TIPOS[t]).toUpperCase()) + '</button>').join('');
    corpo.innerHTML =
      '<div class="pin-nome" style="text-align:center;margin-bottom:12px">Olá, ' + esc(sel.nome) + '</div>' + mensagem(erro) +
      '<div class="acoes">' + botoes +
      '<button class="acao-btn sec" id="ver-marcacoes" style="font-size:15px;padding:14px">Minhas marcações (48 h)</button>' +
      '<button class="acao-btn sec" id="pedir" style="font-size:15px;padding:14px">Esqueci de bater — pedir correção</button>' +
      '<button class="btn" id="sair" style="justify-content:center">Sair</button>' +
      '</div><div id="lista-ult"></div>';
    corpo.querySelectorAll('[data-tipo]').forEach((b) => b.onclick = () => registrar(b.dataset.tipo));
    $('sair').onclick = () => inicio();
    $('pedir').onclick = () => telaCorrecao();
    $('ver-marcacoes').onclick = () => {
      const u = estado.ultimas;
      $('lista-ult').innerHTML = '<ul class="ultimas">' + (u.length
        ? u.map((m) => '<li><span>' + esc(TIPOS[m.tipo]) + '</span><span>' + esc(dataHora(m.marcado_em)) + ' · NSR ' + esc(m.nsr) + '</span></li>').join('')
        : '<li>Nenhuma marcação nas últimas 48 h.</li>') + '</ul>';
    };
  }

  async function registrar(tipo) {
    document.querySelectorAll('.acao-btn').forEach((b) => b.disabled = true);
    // Foto de prova: o quadro da câmera neste instante. Sem câmera, a marcação segue sem foto (alerta no painel).
    let foto = null, fotoHash = null;
    if (info.estacao.tira_foto && window.PontoFoto) {
      foto = await window.PontoFoto.capturarAgora();
      if (foto) { try { fotoHash = await window.PontoFoto.hash(foto); } catch (e) { foto = null; } }
      if (!foto) sinal();
    }
    const r = await rpc('registrar', { token, funcionario_id: sel.id, pin, tipo, foto_hash: fotoHash });
    if (!r.ok) {
      if (['pin_invalido', 'bloqueado'].includes(r.erro)) return irParaLista({ texto: msgErro(r.erro), tipo: 'erro' });
      const nova = await rpc('estado', { token, funcionario_id: sel.id, pin });
      if (nova.ok) estado = nova;
      return telaAcao(msgErro(r.erro));
    }
    // o arquivo sobe em segundo plano; a marcação (com o hash da foto) já está gravada
    if (foto && r.marcacao_id) window.PontoFoto.enviar(foto, { token, marcacaoId: r.marcacao_id });
    telaComprovante(r.comprovante);
  }

  function telaComprovante(c) {
    clearTimeout(ocioso);
    let seg = 12;
    corpo.innerHTML =
      '<div class="ok-big"><i class="ti ti-circle-check"></i></div>' +
      '<p style="text-align:center;font-size:20px;font-weight:600;margin:6px 0 14px">' + esc(TIPOS[c.tipo]) + ' registrada às ' + esc(hora(c.marcado_em)) + '</p>' +
      '<div class="comprovante"><h3>' + esc(c.titulo) + '</h3><dl>' +
      '<dt>Trabalhador</dt><dd>' + esc(c.funcionario) + '</dd>' +
      '<dt>Empresa</dt><dd>' + esc(c.empresa) + (c.cnpj ? ' · ' + esc(c.cnpj) : '') + '</dd>' +
      (c.endereco ? '<dt>Local</dt><dd>' + esc(c.endereco) + '</dd>' : '') +
      '<dt>Data/hora</dt><dd>' + esc(dataHora(c.marcado_em)) + '</dd>' +
      '<dt>Marcação</dt><dd>' + esc(TIPOS[c.tipo]) + '</dd>' +
      '<dt>NSR</dt><dd>' + esc(c.nsr) + '</dd>' +
      '<dt>Hash</dt><dd class="hash">' + esc(c.hash) + '</dd></dl></div>' +
      '<div class="voltar"><button class="btn pri" id="fechar">Concluir</button>' +
      (imprime() ? ' <button class="btn" id="reimprimir"><i class="ti ti-printer"></i> Reimprimir</button>' : '') + ' <span class="muted" id="cont"></span></div>';
    $('fechar').onclick = () => inicio();
    // imprime sozinho (se a estação imprime); com o Chrome em modo --kiosk-printing sai direto na impressora padrão
    if (imprime()) {
      $('reimprimir').onclick = () => imprimirCupom(c);
      setTimeout(() => imprimirCupom(c), 150);
    }
    pin = '';
    const cont = () => { $('cont').textContent = 'voltando em ' + seg + 's'; };
    cont();
    volta = setInterval(() => { seg--; if (seg <= 0) { clearInterval(volta); inicio(); } else cont(); }, 1000);
    // o funcionário pode tirar print do comprovante; a lista de 48 h fica disponível ao entrar de novo
  }

  function telaCorrecao(erro) {
    armarOciosidade();
    const hoje = hojeISO();
    corpo.innerHTML =
      '<div class="card"><h2>Pedir correção de ponto</h2>' +
      '<p class="muted" style="margin-bottom:12px">Informe a marcação que você esqueceu. O gestor vai aprovar ou recusar; até lá, ela não conta.</p>' +
      mensagem(erro) +
      '<div class="row"><div class="field"><label for="c-tipo">Qual marcação?</label><select id="c-tipo">' +
      Object.keys(TIPOS).map((t) => '<option value="' + t + '">' + esc(TIPOS[t]) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="c-data">Dia</label><input type="date" id="c-data" value="' + hoje + '" max="' + hoje + '"></div>' +
      '<div class="field"><label for="c-hora">Horário</label><input type="time" id="c-hora"></div></div>' +
      '<div class="field"><label for="c-motivo">Motivo</label><input id="c-motivo" maxlength="200" placeholder="Ex.: esqueci de bater na volta do intervalo"></div>' +
      '<div style="margin-top:14px;display:flex;gap:8px"><button class="btn pri" id="enviar">Enviar pedido</button><button class="btn" id="voltar">Voltar</button></div></div>';
    $('voltar').onclick = () => telaAcao();
    $('enviar').onclick = async () => {
      const d = $('c-data').value, h = $('c-hora').value, m = $('c-motivo').value.trim();
      if (!d || !h) return telaCorrecao('Informe o dia e o horário.');
      $('enviar').disabled = true;
      const r = await rpc('solicitar_correcao', { token, funcionario_id: sel.id, pin, tipo_marcacao: $('c-tipo').value, marcado_em: d + 'T' + h, motivo: m });
      if (!r.ok) {
        if (['pin_invalido', 'bloqueado'].includes(r.erro)) return irParaLista({ texto: msgErro(r.erro), tipo: 'erro' });
        return telaCorrecao(msgErro(r.erro));
      }
      inicio({ texto: 'Pedido enviado. O gestor vai analisar.', tipo: 'ok' });
    };
  }

  /* ---------- início ---------- */
  token = guardar.get();
  if (!window.PONTO_CONFIG || String(window.PONTO_CONFIG.anonKey).startsWith('COLE_AQUI')) {
    corpo.innerHTML = mensagem('Sistema ainda não configurado.');
  } else if (!token) {
    telaAtivar();
  } else {
    carregar();
  }
})();
</script>
</body>
</html>
